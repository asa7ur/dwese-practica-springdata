<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto px-4 min-h-screen">

    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <h2 class="text-3xl font-bold text-white text-shadow uppercase border-l-4 border-rock-red pl-4">
            <i class="fa-solid fa-ticket mr-2 text-rock-red"></i>
            <span th:text="#{msg.concert.list.title}">Agenda de Conciertos</span>
        </h2>
        <a th:href="@{/concerts/new}"
           class="bg-rock-red hover:bg-rock-darkred text-white font-bold py-2 px-6 rounded shadow-lg transform hover:scale-105 transition duration-300">
            <i class="fa-solid fa-plus mr-1"></i> <span th:text="#{msg.concert.list.btn.new}">Programar Concierto</span>
        </a>
    </div>

    <div th:if="${successMessage}"
         class="bg-green-900/50 border border-green-600 text-green-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-check-circle mr-2"></i><span
                th:text="${successMessage}"></span></span>
    </div>
    <div th:if="${errorMessage}"
         class="bg-red-900/50 border border-red-600 text-red-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-exclamation-triangle mr-2"></i><span
                th:text="${errorMessage}"></span></span>
    </div>

    <div class="bg-rock-800 p-4 rounded-lg shadow-md mb-8 border border-gray-700">
        <form th:action="@{/concerts}" method="get"
              class="flex flex-col md:flex-row gap-4 justify-between items-center">

            <div class="w-full md:w-1/2 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                <input type="text" name="keyword" th:value="${keyword}"
                       class="w-full bg-rock-700 text-white border border-gray-600 rounded pl-10 pr-4 py-2 focus:outline-none focus:border-rock-red transition placeholder-gray-500"
                       th:placeholder="#{msg.concert.list.search.placeholder}">
            </div>

            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <select name="sortBy"
                        class="bg-rock-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-rock-red text-sm">
                    <option value="id" th:selected="${sortBy == 'id'}" th:text="#{msg.sort.default}">Orden: Defecto
                    </option>
                    <option value="startTime" th:selected="${sortBy == 'startTime'}"
                            th:text="#{msg.concert.sort.start_time}">Orden: Hora Inicio
                    </option>
                </select>

                <select name="direction"
                        class="bg-rock-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-rock-red text-sm">
                    <option value="asc" th:selected="${direction == 'asc'}" th:text="#{msg.sort.asc}">Ascendente
                    </option>
                    <option value="desc" th:selected="${direction == 'desc'}" th:text="#{msg.sort.desc}">Descendente
                    </option>
                </select>

                <button type="submit"
                        class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded transition border border-gray-500"
                        th:title="#{msg.btn.filter}">
                    <i class="fa-solid fa-filter"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div th:each="concert : ${listConcerts.concerts}"
             class="bg-rock-800 rounded-lg overflow-hidden shadow-lg hover:shadow-rock-red/20 transition duration-300 border-l-4 border-rock-red group relative flex flex-col">

            <div class="bg-black/40 p-4 border-b border-gray-700 flex justify-between items-center">
                <div class="flex flex-col">
                        <span class="text-rock-red font-bold text-sm uppercase tracking-wider">
                            <i class="fa-regular fa-calendar mr-1"></i> <span
                                th:text="${#temporals.format(concert.startTime, 'dd MMM yyyy')}">12 JUL 2025</span>
                        </span>
                    <span class="text-white font-mono text-lg">
                            <span th:text="${#temporals.format(concert.startTime, 'HH:mm')}">20:00</span> -
                            <span th:text="${#temporals.format(concert.endTime, 'HH:mm')}">22:00</span>
                        </span>
                </div>
                <div class="text-gray-500 group-hover:text-white transition">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>

            <div class="p-6 flex-grow flex flex-col justify-center text-center">
                <h5 class="text-2xl font-bold text-white mb-2 group-hover:scale-105 transition duration-300"
                    th:text="${concert.artist.name}">Metallica</h5>

                <div class="inline-block mx-auto mt-2">
                        <span class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full text-xs font-semibold border border-gray-600">
                            <i class="fa-solid fa-dungeon mr-1 text-rock-red"></i> <span
                                th:text="${concert.stage.name}">Main Stage</span>
                        </span>
                </div>
            </div>

            <div class="bg-black/20 p-3 flex justify-between items-center border-t border-gray-700">
                <span class="text-xs text-gray-500">ID: <span th:text="${concert.id}">1</span></span>

                <div class="flex gap-3">
                    <a th:href="@{/concerts/edit(id=${concert.id})}"
                       class="text-yellow-500 hover:text-yellow-400 text-sm transition" th:title="#{msg.btn.edit}">
                        <i class="fa-solid fa-pen"></i>
                    </a>
                    <form th:action="@{/concerts/delete}" method="post" class="inline">
                        <input type="hidden" name="id" th:value="${concert.id}"/>
                        <button type="submit" class="text-red-500 hover:text-red-400 text-sm transition"
                                th:onclick="return confirm([[#{msg.concert.list.confirm.delete}]]);"
                                th:title="#{msg.btn.delete}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(listConcerts.concerts)}" class="col-span-full text-center py-12">
            <p class="text-gray-500 text-xl" th:text="#{msg.concert.list.empty}">No hay conciertos programados.</p>
        </div>
    </div>

    <div class="mt-10 flex justify-center" th:if="${listConcerts.pages > 1}">
        <nav class="inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
            <a th:each="i : ${#numbers.sequence(1, listConcerts.pages)}"
               th:href="@{/concerts(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}"
               th:text="${i}"
               class="px-4 py-2 border border-gray-700 text-sm font-medium transition"
               th:classappend="${i == listConcerts.currentPage} ? 'bg-rock-red text-white border-rock-red' : 'bg-rock-800 text-gray-400 hover:bg-gray-700'">
                1
            </a>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
