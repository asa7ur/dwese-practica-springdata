<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto px-4 min-h-screen">

    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <h2 class="text-3xl font-bold text-white text-shadow uppercase border-l-4 border-rock-red pl-4">
            <i class="fa-solid fa-dungeon mr-2 text-rock-red"></i>Escenarios
        </h2>
        <a th:href="@{/stages/new}"
           class="bg-rock-red hover:bg-rock-darkred text-white font-bold py-2 px-6 rounded shadow-lg transform hover:scale-105 transition duration-300">
            <i class="fa-solid fa-plus mr-1"></i> Nuevo Escenario
        </a>
    </div>

    <div th:if="${successMessage}"
         class="bg-green-900/50 border border-green-600 text-green-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-check-circle mr-2"></i><span
                th:text="${successMessage}"></span></span>
    </div>
    <div th:if="${errorMessage}"
         class="bg-red-900/50 border border-red-600 text-red-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-exclamation-triangle mr-2"></i><span
                th:text="${errorMessage}"></span></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        <div th:each="stage : ${stages}"
             class="bg-rock-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-rock-red hover:shadow-[0_5px_15px_rgba(220,53,69,0.2)] transition duration-300 transform hover:-translate-y-1 group relative">

            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition duration-500">
                <i class="fa-solid fa-dungeon fa-6x text-white"></i>
            </div>

            <div class="p-8 relative z-10">
                <h5 class="text-2xl font-bold text-white mb-2 group-hover:text-rock-red transition duration-300"
                    th:text="${stage.name}">Main Stage</h5>

                <div class="flex items-center mt-4 mb-6">
                    <div class="bg-black/40 rounded-lg p-3 border border-gray-600 flex items-center gap-3">
                        <i class="fa-solid fa-users text-rock-red text-xl"></i>
                        <div>
                            <span class="block text-xs text-gray-400 uppercase">Aforo Máximo</span>
                            <span class="text-xl font-bold text-white" th:text="${stage.capacity}">50000</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mt-4 border-t border-gray-700 pt-4">
                    <a th:href="@{/stages/edit(id=${stage.id})}"
                       class="flex-1 text-center py-2 rounded bg-gray-700 hover:bg-yellow-600/20 text-gray-300 hover:text-yellow-500 transition border border-transparent hover:border-yellow-500/50">
                        <i class="fa-solid fa-pen mr-1"></i> Editar
                    </a>

                    <form th:action="@{/stages/delete}" method="post" class="flex-1">
                        <input type="hidden" name="id" th:value="${stage.id}"/>
                        <button type="submit"
                                class="w-full py-2 rounded bg-gray-700 hover:bg-red-600/20 text-gray-300 hover:text-red-500 transition border border-transparent hover:border-red-500/50"
                                onclick="return confirm('¿Seguro que quieres eliminar este escenario? Si tiene conciertos, no se podrá borrar.');">
                            <i class="fa-solid fa-trash mr-1"></i> Borrar
                        </button>
                    </form>
                </div>
            </div>

            <div class="h-1 w-full bg-gradient-to-r from-rock-800 via-rock-red to-rock-800 opacity-0 group-hover:opacity-100 transition duration-300"></div>
        </div>

        <div th:if="${#lists.isEmpty(stages)}"
             class="col-span-full text-center py-12 bg-rock-800/50 rounded-xl border border-dashed border-gray-600">
            <i class="fa-solid fa-wind text-4xl text-gray-600 mb-4"></i>
            <p class="text-gray-400 text-lg">No hay escenarios creados todavía.</p>
            <a th:href="@{/stages/new}" class="text-rock-red hover:underline mt-2 inline-block">¡Crea el primero
                ahora!</a>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
