<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto px-4 flex justify-center items-center min-h-[80vh]">
    <div class="w-full max-w-2xl">
        <div class="bg-rock-800 rounded-lg shadow-2xl border border-gray-700 overflow-hidden">

            <div class="bg-black/40 px-6 py-4 border-b border-gray-700">
                <h4 class="text-lg font-bold text-white uppercase tracking-wide">
                    <i class="fa-solid fa-calendar-plus mr-2 text-rock-red"></i>
                    <span th:text="${concert.id} ? #{msg.concert.form.title.edit} : #{msg.concert.form.title.new}">Formulario</span>
                </h4>
            </div>

            <div class="p-8">
                <form th:action="${concert.id != null} ? @{/concerts/update} : @{/concerts/insert}"
                      th:object="${concert}" method="post" class="space-y-6">

                    <input type="hidden" th:field="*{id}"/>

                    <div>
                        <label for="artist" class="block text-sm font-medium text-gray-400 mb-1"
                               th:text="#{msg.concert.form.label.artist}">Artista / Banda</label>
                        <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                    <i class="fa-solid fa-guitar"></i>
                                </span>
                            <select id="artist" th:field="*{artist}"
                                    class="w-full bg-rock-700 text-white border border-gray-600 rounded-md py-2 pl-10 pr-3 focus:outline-none focus:border-rock-red focus:ring-1 focus:ring-rock-red transition appearance-none">
                                <option value="" disabled selected th:text="#{msg.concert.form.placeholder.artist}">
                                    Selecciona una banda...
                                </option>
                                <option th:each="art : ${allArtists}"
                                        th:value="${art.id}"
                                        th:text="${art.name}">Metallica
                                </option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                        <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('artist')}"
                           th:errors="*{artist}">Error</p>
                    </div>

                    <div>
                        <label for="stage" class="block text-sm font-medium text-gray-400 mb-1"
                               th:text="#{msg.concert.form.label.stage}">Escenario</label>
                        <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                    <i class="fa-solid fa-dungeon"></i>
                                </span>
                            <select id="stage" th:field="*{stage}"
                                    class="w-full bg-rock-700 text-white border border-gray-600 rounded-md py-2 pl-10 pr-3 focus:outline-none focus:border-rock-red focus:ring-1 focus:ring-rock-red transition appearance-none">
                                <option value="" disabled selected th:text="#{msg.concert.form.placeholder.stage}">
                                    Selecciona un escenario...
                                </option>
                                <option th:each="stg : ${allStages}"
                                        th:value="${stg.id}"
                                        th:text="${stg.name}">Main Stage
                                </option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                        <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('stage')}" th:errors="*{stage}">
                            Error</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <label for="startTime" class="block text-sm font-medium text-gray-400 mb-1"
                                   th:text="#{msg.concert.form.label.start}">Inicio</label>
                            <div class="relative">
                                <input type="datetime-local" id="startTime" th:field="*{startTime}"
                                       class="w-full bg-rock-700 text-white border border-gray-600 rounded-md py-2 px-3 focus:outline-none focus:border-rock-red focus:ring-1 focus:ring-rock-red transition [color-scheme:dark]">
                            </div>
                            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('startTime')}"
                               th:errors="*{startTime}">Error</p>
                        </div>

                        <div>
                            <label for="endTime" class="block text-sm font-medium text-gray-400 mb-1"
                                   th:text="#{msg.concert.form.label.end}">Fin</label>
                            <div class="relative">
                                <input type="datetime-local" id="endTime" th:field="*{endTime}"
                                       class="w-full bg-rock-700 text-white border border-gray-600 rounded-md py-2 px-3 focus:outline-none focus:border-rock-red focus:ring-1 focus:ring-rock-red transition [color-scheme:dark]">
                            </div>
                            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('endTime')}"
                               th:errors="*{endTime}">Error</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mt-8 pt-4 border-t border-gray-700">
                        <button type="submit"
                                class="flex-1 bg-rock-red hover:bg-rock-darkred text-white font-bold py-2 px-4 rounded transition duration-300">
                            <span th:text="#{msg.concert.form.btn.save}">Guardar Concierto</span>
                        </button>
                        <a th:href="@{/concerts}"
                           class="flex-1 text-center bg-transparent border border-gray-600 hover:border-gray-400 text-gray-300 hover:text-white font-medium py-2 px-4 rounded transition duration-300">
                            <span th:text="#{msg.btn.cancel}">Cancelar</span>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
