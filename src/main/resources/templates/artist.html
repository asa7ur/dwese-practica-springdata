<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto px-4 min-h-screen">

    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <h2 class="text-3xl font-bold text-white text-shadow uppercase border-l-4 border-rock-red pl-4">
            <i class="fa-solid fa-guitar mr-2 text-rock-red"></i>
            <span th:text="#{msg.artist.list.title}">Line-Up / Artistas</span>
        </h2>
        <a th:href="@{/artists/new}"
           class="bg-rock-red hover:bg-rock-darkred text-white font-bold py-2 px-6 rounded shadow-lg transform hover:scale-105 transition duration-300">
            <i class="fa-solid fa-plus mr-1"></i> <span th:text="#{msg.artist.list.btn.new}">Nuevo Artista</span>
        </a>
    </div>

    <div th:if="${successMessage}"
         class="bg-green-900/50 border border-green-600 text-green-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-check-circle mr-2"></i><span
                th:text="${successMessage}"></span></span>
    </div>
    <div th:if="${errorMessage}"
         class="bg-red-900/50 border border-red-600 text-red-100 px-4 py-3 rounded relative mb-6" role="alert">
        <span class="block sm:inline"><i class="fa-solid fa-exclamation-triangle mr-2"></i><span
                th:text="${errorMessage}"></span></span>
    </div>

    <div class="bg-rock-800 p-4 rounded-lg shadow-md mb-8 border border-gray-700">
        <form th:action="@{/artists}" method="get" class="flex flex-col md:flex-row gap-4 justify-between items-center">

            <div class="w-full md:w-1/2 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" name="keyword" th:value="${keyword}"
                       class="w-full bg-rock-700 text-white border border-gray-600 rounded pl-10 pr-4 py-2 focus:outline-none focus:border-rock-red transition placeholder-gray-500"
                       th:placeholder="#{msg.artist.list.search.placeholder}">
            </div>

            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <select name="sortBy"
                        class="bg-rock-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-rock-red text-sm">
                    <option value="id" th:selected="${sortBy == 'id'}" th:text="#{msg.sort.default}">Por Defecto
                    </option>
                    <option value="name" th:selected="${sortBy == 'name'}" th:text="#{msg.sort.name}">Nombre</option>
                    <option value="genre" th:selected="${sortBy == 'genre'}" th:text="#{msg.sort.genre}">Género</option>
                    <option value="country" th:selected="${sortBy == 'country'}" th:text="#{msg.sort.country}">País
                    </option>
                </select>

                <select name="direction"
                        class="bg-rock-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-rock-red text-sm">
                    <option value="asc" th:selected="${direction == 'asc'}" th:text="#{msg.sort.asc}">Ascendente
                    </option>
                    <option value="desc" th:selected="${direction == 'desc'}" th:text="#{msg.sort.desc}">Descendente
                    </option>
                </select>

                <button type="submit"
                        class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded transition border border-gray-500"
                        th:title="#{msg.btn.filter}">
                    <i class="fa-solid fa-filter"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="artist : ${listArtists.artists}"
             class="bg-rock-800 rounded-lg overflow-hidden shadow-lg hover:shadow-rock-red/20 hover:-translate-y-1 transition duration-300 group border border-gray-700">
            <div class="px-6 pt-4 flex justify-end">
                <span class="inline-block bg-gray-700 border border-gray-600 rounded-full px-3 py-1 text-xs font-semibold text-gray-300"
                      th:text="${artist.country}">USA</span>
            </div>

            <div class="p-6 text-center">
                <div th:if="${artist.image != null}" class="mb-4 relative w-32 h-32 mx-auto">
                    <img th:src="@{'/uploads/' + ${artist.image}}"
                         class="w-full h-full object-cover rounded-full border-4 border-rock-red shadow-lg"
                         alt="Artist Image">
                </div>

                <div th:unless="${artist.image != null}"
                     class="mb-4 text-gray-600 group-hover:text-rock-red transition duration-300">
                    <i class="fa-solid fa-users fa-4x"></i>
                </div>

                <h5 class="text-xl font-bold text-white mb-1" th:text="${artist.name}">Nombre</h5>
                <p class="text-rock-red font-medium text-sm uppercase tracking-wide" th:text="${artist.genre}">
                    Género</p>
            </div>

            <div class="bg-black/20 px-6 py-4 flex justify-center gap-3 border-t border-gray-700">
                <a th:href="@{/artists/edit(id=${artist.id})}"
                   class="text-yellow-500 hover:text-yellow-400 font-medium text-sm transition">
                    <i class="fa-solid fa-pen mr-1"></i> <span th:text="#{msg.btn.edit}">Editar</span>
                </a>

                <form th:action="@{/artists/delete}" method="post" class="inline">
                    <input type="hidden" name="id" th:value="${artist.id}"/>
                    <button type="submit"
                            class="text-red-500 hover:text-red-400 font-medium text-sm transition ml-2"
                            th:data-confirm-msg="#{msg.artist.list.confirm.delete}"
                            onclick="return confirm(this.getAttribute('data-confirm-msg'))">
                        <i class="fa-solid fa-trash mr-1"></i> <span th:text="#{msg.btn.delete}">Borrar</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-10 flex justify-center" th:if="${listArtists.pages > 1}">
        <nav class="inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
            <a th:each="i : ${#numbers.sequence(1, listArtists.pages)}"
               th:href="@{/artists(page=${i}, keyword=${keyword}, sortBy=${sortBy}, direction=${direction})}"
               th:text="${i}"
               class="px-4 py-2 border border-gray-700 text-sm font-medium transition"
               th:classappend="${i == listArtists.currentPage} ? 'bg-rock-red text-white border-rock-red' : 'bg-rock-800 text-gray-400 hover:bg-gray-700'">
                1
            </a>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
